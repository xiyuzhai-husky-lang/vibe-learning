<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Read</title>
    <script>
      // Apply the saved theme before first paint. Default is light; "system" leaves the attribute off.
      var theme = "light";
      try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "system") theme = t; } catch (e) {}
      if (theme !== "system") document.documentElement.setAttribute("data-theme", theme);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
