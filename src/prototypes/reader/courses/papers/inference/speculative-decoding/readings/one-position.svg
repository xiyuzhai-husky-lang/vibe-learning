<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" role="img" aria-label="One position: draft proposes, target checks, residual on rejection"><defs><marker id="af4672e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink)"/></marker></defs><rect x="20" y="30" width="130" height="44" rx="6" style="fill:var(--panel);stroke:var(--ink);stroke-width:1.2"/><text x="85.0" y="56.68" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-family:ui-monospace,Menlo,monospace">draft: x ~ q</text><line x1="150" y1="52" x2="190" y2="52" style="stroke:var(--ink);stroke-width:1.4;fill:none" marker-end="url(#af4672e)"/><rect x="192" y="30" width="150" height="44" rx="6" style="fill:var(--panel);stroke:var(--ink);stroke-width:1.2"/><text x="267.0" y="56.68" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-family:ui-monospace,Menlo,monospace">target: compute p</text><line x1="342" y1="52" x2="382" y2="52" style="stroke:var(--ink);stroke-width:1.4;fill:none" marker-end="url(#af4672e)"/><rect x="384" y="20" width="156" height="64" rx="6" style="fill:var(--panel-2);stroke:var(--ink);stroke-width:1.2"/><text x="462" y="44" text-anchor="middle" style="fill:var(--ink);font-size:12px">keep x with prob</text><text x="462" y="66" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-family:ui-monospace,Menlo,monospace">min(1, p(x)/q(x))</text><line x1="462" y1="84" x2="462" y2="118" style="stroke:var(--ok);stroke-width:1.6;fill:none" marker-end="url(#af4672e)"/><text x="472" y="104" text-anchor="start" style="fill:var(--ok);font-size:11px">yes</text><rect x="392" y="120" width="140" height="40" rx="6" style="fill:var(--ok);stroke:none;stroke-width:1.2"/><text x="462.0" y="144.68" text-anchor="middle" style="fill:var(--ink);font-size:13px;font-family:ui-monospace,Menlo,monospace">emit x</text><path d="M400,84 L400,100 L265,100 L265,118" style="stroke:var(--bad);stroke-width:1.6;fill:none" marker-end="url(#af4672e)"/><text x="257" y="114" text-anchor="end" style="fill:var(--bad);font-size:11px">no</text><rect x="150" y="120" width="230" height="64" rx="6" style="fill:var(--panel-2);stroke:var(--bad);stroke-width:1.2"/><text x="265" y="144" text-anchor="middle" style="fill:var(--ink);font-size:12px">sample from the residual</text><text x="265" y="166" text-anchor="middle" style="fill:var(--ink);font-size:12px;font-family:ui-monospace,Menlo,monospace">norm(max(0, p − q))</text><text x="265" y="202" text-anchor="middle" style="fill:var(--muted);font-size:11px">and emit it</text></svg>
